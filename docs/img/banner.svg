<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" role="img" aria-labelledby="t d">
  <title id="t">DistribuTech Pro</title>
  <desc id="d">Banner del proyecto: plataforma B2B de cotizaciones con control de stock.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx=".88" cy=".2" r=".5">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".45"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="240" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="240" rx="16" fill="url(#grid)"/>
  <rect width="1280" height="240" rx="16" fill="url(#glow)"/>

  <!-- Logo (mismo dibujo que public/favicon.svg) -->
  <g transform="translate(92 56) scale(4)">
    <rect width="32" height="32" rx="7" fill="#2563eb"/>
    <path d="M8 8h7a8 8 0 0 1 0 16H8z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M19 12h6M22 12v12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Texto -->
  <text x="282" y="104" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="700" fill="#f8fafc">DistribuTech <tspan fill="#60a5fa">Pro</tspan></text>
  <text x="284" y="144" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#cbd5e1">Plataforma B2B de cotizaciones con control de stock</text>

  <!-- Roles -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600">
    <rect x="284" y="172" width="96" height="30" rx="8" fill="#2563eb" fill-opacity=".18" stroke="#3b82f6" stroke-opacity=".7"/>
    <text x="332" y="192" text-anchor="middle" fill="#bfdbfe">Cliente</text>
    <rect x="390" y="172" width="118" height="30" rx="8" fill="#2563eb" fill-opacity=".18" stroke="#3b82f6" stroke-opacity=".7"/>
    <text x="449" y="192" text-anchor="middle" fill="#bfdbfe">Comercial</text>
    <rect x="518" y="172" width="148" height="30" rx="8" fill="#2563eb" fill-opacity=".18" stroke="#3b82f6" stroke-opacity=".7"/>
    <text x="592" y="192" text-anchor="middle" fill="#bfdbfe">Administrador</text>
  </g>

  <!-- Datos del esquema -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <text x="1000" y="150" font-size="40" font-weight="700" fill="#f8fafc">15</text>
    <text x="1000" y="176" font-size="15" fill="#94a3b8">tablas con RLS</text>
    <text x="1130" y="150" font-size="40" font-weight="700" fill="#f8fafc">24</text>
    <text x="1130" y="176" font-size="15" fill="#94a3b8">políticas</text>
  </g>
</svg>
