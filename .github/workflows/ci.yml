name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Solo lectura del repositorio: el workflow no publica nada.
permissions:
  contents: read

# Si llega otro push a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # npm ci instala exactamente lo que dice package-lock.json
      - run: npm ci

      - name: Lint
        run: npm run lint

      # Los tests simulan Supabase: no necesitan claves ni red
      - name: Tests
        run: npm test

      # Sin .env: Vite compila igual; las variables solo se leen en el navegador
      - name: Build
        run: npm run build
